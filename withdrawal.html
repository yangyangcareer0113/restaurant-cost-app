<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日提領 — 烽味營運管理系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    .calc-box { background:#f8fafc; border-radius:8px; padding:12px 14px; font-size:0.85rem; }
    .remain-bar { background:#eff6ff; border:1.5px solid #93c5fd; border-radius:10px;
                  padding:12px 18px; display:flex; justify-content:space-between; align-items:center;
                  margin-bottom:1rem; }
    .remain-bar .remain-label { font-size:0.88rem; color:#1d4ed8; font-weight:600; }
    .remain-bar .remain-val   { font-size:1.5rem; font-weight:800; color:#1d4ed8; }
  </style>
</head>
<body>
  <div class="main-content">
    <div class="top-header">
      <button class="btn btn-sm btn-outline-secondary d-md-none me-2" onclick="toggleSidebar()">☰</button>
      <h6 class="mb-0 fw-bold">📤 每日提領</h6>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <select id="store-filter" class="form-select form-select-sm d-none" style="width:auto;" onchange="onStoreChange()">
          <option value="">所有門店</option>
        </select>
        <input type="date" id="filter-date" class="form-control form-control-sm" style="width:auto;" onchange="loadRecords()">
      </div>
    </div>

    <div class="page-body">
      <div class="row g-3">

        <!-- 左欄：新增提領 -->
        <div class="col-12 col-lg-4">
          <div class="table-card">
            <div class="table-header">
              <span class="fw-semibold">📤 新增提領</span>
            </div>
            <div class="p-3">
              <div class="mb-3">
                <label class="form-label fw-semibold">日期</label>
                <input type="date" id="rec-date" class="form-control" onchange="onRecDateChange()">
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">品項 <span class="text-danger">*</span></label>
                <div class="ic-wrap">
                  <input type="text" id="rec-item-search" class="form-control" placeholder="打字搜尋，或點 ▾ 展開全部" autocomplete="off">
                  <button type="button" class="ic-caret" id="rec-item-caret" aria-label="展開品項清單">▾</button>
                  <div id="rec-item-panel" class="ic-panel d-none"></div>
                </div>
                <input type="hidden" id="rec-item">
              </div>

              <!-- 目前庫存提示 -->
              <div id="stock-hint" class="calc-box mb-3 d-none">
                <div class="d-flex justify-content-between">
                  <span class="text-muted">目前庫存</span>
                  <span id="hint-base" class="fw-semibold text-primary">—</span>
                </div>
                <div class="d-flex justify-content-between mt-1">
                  <span class="text-muted">資料來源</span>
                  <span id="hint-source" class="text-muted" style="font-size:0.8rem;">—</span>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">提領數量 <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input type="number" id="rec-qty" class="form-control" min="0" step="0.01" placeholder="0" oninput="calcPreview()">
                  <span class="input-group-text" id="qty-unit" style="font-size:0.8rem;min-width:40px;">—</span>
                </div>
              </div>

              <!-- 即時計算：剩餘庫存 -->
              <div id="calc-preview" class="calc-box mb-3 d-none">
                <div class="d-flex justify-content-between">
                  <span class="text-muted">提領後剩餘庫存</span>
                  <strong id="prev-remain" class="fs-6">—</strong>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">備註</label>
                <input type="text" id="rec-notes" class="form-control" placeholder="選填">
              </div>

              <button class="btn btn-primary w-100" onclick="saveRecord()">✓ 儲存提領記錄</button>
            </div>
          </div>
        </div>

        <!-- 右欄：提領清單 -->
        <div class="col-12 col-lg-8">
          <div class="remain-bar">
            <span class="remain-label">📅 <span id="display-date">今日</span> 提領筆數</span>
            <span class="remain-val"><span id="daily-count">0</span> 筆</span>
          </div>

          <div class="table-card">
            <div class="table-header d-flex justify-content-between">
              <span class="fw-semibold">提領明細</span>
              <small class="text-muted" id="record-count">— 筆</small>
            </div>
            <div class="table-responsive">
              <table class="table table-hover mb-0 table-responsive-card">
                <thead>
                  <tr>
                    <th>日期</th>
                    <th>品項</th>
                    <th>提領數量</th>
                    <th>剩餘庫存</th>
                    <th>備註</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="records-table">
                  <tr><td colspan="6" class="text-center text-muted py-4">載入中...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/item-combo.js"></script>
  <script>
    let currentProfile = null;
    let itemsMap = {};
    let itemCombo = null;
    let currentBase = null; // { base, source, date } — 目前選定品項的庫存基準
    let _itemChangeSeq = 0; // 快速切換品項時，避免舊查詢覆寫新結果

    document.addEventListener('DOMContentLoaded', async () => {
      await requireAuth();
      injectNav();
      const data = await renderUserInfo();
      currentProfile = data.profile;
      filterNavByRole(currentProfile.role);

      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('rec-date').value = today;
      document.getElementById('filter-date').value = today;

      if (currentProfile.role === 'admin') {
        await loadStoresFilter();
        document.getElementById('store-filter').classList.remove('d-none');
      }

      itemCombo = createItemCombo({
        input:  document.getElementById('rec-item-search'),
        panel:  document.getElementById('rec-item-panel'),
        hidden: document.getElementById('rec-item'),
        caret:  document.getElementById('rec-item-caret'),
        onSelect: onItemChange
      });

      await loadItemsDropdown();
      await loadRecords();
    });

    function activeStoreId() {
      return currentProfile.role === 'admin'
        ? (document.getElementById('store-filter').value || null)
        : currentProfile.store_id;
    }

    async function loadStoresFilter() {
      const { data } = await supabase.from('stores').select('id,name').order('name');
      const sel = document.getElementById('store-filter');
      (data || []).forEach(s => sel.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.name}</option>`));
    }

    async function onRecDateChange() {
      document.getElementById('filter-date').value = document.getElementById('rec-date').value;
      await loadRecords();
    }

    async function onStoreChange() {
      await loadItemsDropdown();
      resetItem();
      await loadRecords();
    }

    async function loadItemsDropdown() {
      const storeId = activeStoreId();
      let q = supabase.from('items').select('id,name,unit,category,store_id').eq('is_active', true).order('category').order('name');
      if (storeId) q = q.eq('store_id', storeId);
      const { data } = await q;

      // 提領頁沒有成本欄位，機密品項（大陸進貨）員工一樣要能提領登記，不做過濾
      const visibleItems = data || [];

      itemsMap = {};
      visibleItems.forEach(i => { itemsMap[i.id] = i; });
      itemCombo.setItems(visibleItems);
    }

    function resetItem() {
      if (itemCombo) itemCombo.clear();
      document.getElementById('rec-item').value = '';
      document.getElementById('rec-qty').value = '';
      document.getElementById('rec-notes').value = '';
      document.getElementById('qty-unit').textContent = '—';
      document.getElementById('stock-hint').classList.add('d-none');
      document.getElementById('calc-preview').classList.add('d-none');
      currentBase = null;
    }

    // 取得該品項的庫存基準：
    // 三個來源比日期，取最新的當基準——
    //   1. 最新一張「已提交／已審核」月底盤點的實際盤點數量（counted_qty）
    //   2. 最新一筆有填庫存的進貨／耗損記錄（inventory_records.current_stock）
    //   3. 最新一筆提領記錄的剩餘庫存（withdrawal_records.remaining_stock）
    // 同一天時的優先序：提領後剩餘 > 盤點結果 > 進貨庫存記錄
    //   （提領已經接在盤點之後往下扣，盤點是實際清點數，優先於進貨推估）
    async function getBaseStock(itemId, storeId) {
      let invQ = supabase.from('inventory_records')
        .select('current_stock, record_date, created_at')
        .eq('item_id', itemId)
        .not('current_stock', 'is', null)
        .order('record_date', { ascending: false })
        .order('created_at', { ascending: false })
        .limit(1);
      if (storeId) invQ = invQ.eq('store_id', storeId);
      const { data: inv } = await invQ;
      const snap = inv && inv[0]
        ? { val: parseFloat(inv[0].current_stock), date: inv[0].record_date }
        : null;

      let wQ = supabase.from('withdrawal_records')
        .select('remaining_stock, record_date, created_at')
        .eq('item_id', itemId)
        .not('remaining_stock', 'is', null)
        .order('record_date', { ascending: false })
        .order('created_at', { ascending: false })
        .limit(1);
      if (storeId) wQ = wQ.eq('store_id', storeId);
      const { data: w } = await wQ;
      const lastW = w && w[0]
        ? { val: parseFloat(w[0].remaining_stock), date: w[0].record_date }
        : null;

      const stk = await getLatestStocktakeCount(itemId, storeId);

      const cands = [];
      if (lastW) cands.push({ val: lastW.val, date: lastW.date, pri: 3, source: `接續 ${lastW.date} 的提領後剩餘` });
      if (stk)   cands.push({ val: stk.val,   date: stk.date,   pri: 2, source: `${stk.period} 月底盤點結果` });
      if (snap)  cands.push({ val: snap.val,  date: snap.date,  pri: 1, source: `${snap.date} 的庫存記錄` });
      if (!cands.length) return { base: null, source: null, date: null };

      cands.sort((a, b) => (a.date === b.date ? b.pri - a.pri : (a.date < b.date ? 1 : -1)));
      const win = cands[0];
      return { base: win.val, source: win.source, date: win.date };
    }

    // 最新一張「已提交／已審核」盤點單裡，有盤到這個品項的盤點數量。
    // 盤點單只有 period（YYYY-MM），實際生效日取 reviewed_at／submitted_at 的日期。
    async function getLatestStocktakeCount(itemId, storeId) {
      let stQ = supabase.from('stocktakes')
        .select('id, period, submitted_at, reviewed_at')
        .in('status', ['submitted', 'reviewed'])
        .order('period', { ascending: false })
        .limit(6);
      if (storeId) stQ = stQ.eq('store_id', storeId);
      const { data: sts } = await stQ;
      if (!sts || !sts.length) return null;

      const byId = {};
      sts.forEach(s => { byId[s.id] = s; });

      const { data: sis } = await supabase.from('stocktake_items')
        .select('stocktake_id, counted_qty')
        .in('stocktake_id', sts.map(s => s.id))
        .eq('item_id', itemId)
        .not('counted_qty', 'is', null);
      if (!sis || !sis.length) return null;

      // 這些盤點單裡，period 最新且有盤到本品項的那一張
      sis.sort((a, b) => byId[b.stocktake_id].period.localeCompare(byId[a.stocktake_id].period));
      const hit = sis[0];
      const st  = byId[hit.stocktake_id];
      const eff = (st.reviewed_at || st.submitted_at || `${st.period}-28`).slice(0, 10);
      return { val: parseFloat(hit.counted_qty), date: eff, period: st.period };
    }

    async function onItemChange(itemId) {
      const seq = ++_itemChangeSeq;
      itemId = itemId || document.getElementById('rec-item').value;
      const item = itemsMap[itemId];
      const hint = document.getElementById('stock-hint');

      if (!item) {
        hint.classList.add('d-none');
        document.getElementById('qty-unit').textContent = '—';
        document.getElementById('calc-preview').classList.add('d-none');
        currentBase = null;
        return;
      }

      document.getElementById('qty-unit').textContent = item.unit || '—';
      const base = await getBaseStock(itemId, activeStoreId());
      if (seq !== _itemChangeSeq) return; // 使用者已切換到別的品項，放棄這次結果
      currentBase = base;

      hint.classList.remove('d-none');
      document.getElementById('hint-base').textContent = currentBase.base !== null
        ? `${formatNumber(currentBase.base, 2)} ${item.unit || ''}`.trim()
        : '無庫存資料（無法自動算剩餘）';
      document.getElementById('hint-source').textContent = currentBase.source || '—';
      calcPreview();
    }

    function calcPreview() {
      const qty = parseFloat(document.getElementById('rec-qty').value) || 0;
      const preview = document.getElementById('calc-preview');
      const item = itemsMap[document.getElementById('rec-item').value];
      if (!item || !qty) { preview.classList.add('d-none'); return; }
      preview.classList.remove('d-none');
      const el = document.getElementById('prev-remain');
      if (currentBase && currentBase.base !== null) {
        const remain = currentBase.base - qty;
        el.textContent = `${formatNumber(remain, 2)} ${item.unit || ''}`.trim();
        el.classList.toggle('text-danger', remain < 0);
        el.classList.toggle('text-primary', remain >= 0);
      } else {
        el.textContent = '—（無庫存基準）';
        el.classList.remove('text-danger');
        el.classList.add('text-primary');
      }
    }

    async function saveRecord() {
      const itemId = document.getElementById('rec-item').value;
      if (!itemId) { showToast('請選擇品項', 'danger'); return; }
      const qty = parseFloat(document.getElementById('rec-qty').value) || 0;
      if (qty <= 0) { showToast('請填寫提領數量', 'danger'); return; }

      const storeId = currentProfile.role === 'admin'
        ? (document.getElementById('store-filter').value || itemsMap[itemId]?.store_id)
        : currentProfile.store_id;

      const remaining = (currentBase && currentBase.base !== null) ? currentBase.base - qty : null;

      const { data: { session } } = await supabase.auth.getSession();
      const payload = {
        item_id: itemId,
        store_id: storeId,
        record_date: document.getElementById('rec-date').value,
        withdraw_qty: qty,
        remaining_stock: remaining,
        notes: document.getElementById('rec-notes').value.trim() || null,
        created_by: session.user.id
      };

      const { error } = await supabase.from('withdrawal_records').insert(payload);
      if (error) { showToast('儲存失敗：' + error.message, 'danger'); return; }

      const unit = itemsMap[itemId].unit || '';
      showToast(`✓ 已提領：${itemsMap[itemId].name} × ${qty} ${unit}${remaining !== null ? `，剩餘 ${formatNumber(remaining, 2)} ${unit}` : ''}`);

      resetItem();
      await loadRecords();
    }

    async function loadRecords() {
      const dateFilter = document.getElementById('filter-date').value;
      const storeId = activeStoreId();

      let q = supabase.from('withdrawal_records')
        .select('*, items(name, unit, category)')
        .order('created_at', { ascending: false });
      if (storeId) q = q.eq('store_id', storeId);
      if (dateFilter) q = q.eq('record_date', dateFilter);

      const { data } = await q;
      const records = data || [];

      if (dateFilter) {
        const d = new Date(dateFilter + 'T00:00:00');
        document.getElementById('display-date').textContent = `${d.getMonth() + 1}/${d.getDate()}`;
      }
      document.getElementById('daily-count').textContent = records.length;
      document.getElementById('record-count').textContent = `${records.length} 筆`;

      const tbody = document.getElementById('records-table');
      if (!records.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-5">
          此日期尚無提領記錄<br><small>選擇品項並填入提領數量即可新增</small>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = records.map(r => {
        const unit = r.items?.unit || '';
        const remain = r.remaining_stock;
        const remainCell = (remain === null || remain === undefined)
          ? '<span class="text-muted">—</span>'
          : `<strong class="${remain < 0 ? 'text-danger' : ''}">${formatNumber(remain, 2)}</strong> ${unit}`;
        return `
          <tr>
            <td data-label="日期">${r.record_date}</td>
            <td data-label="品項"><strong>${r.items?.name || '—'}</strong>
              <span class="badge bg-light text-secondary border" style="font-size:0.68rem;">${r.items?.category || '—'}</span></td>
            <td data-label="提領數量"><span class="fw-semibold">${formatNumber(r.withdraw_qty, 2)}</span> ${unit}</td>
            <td data-label="剩餘庫存">${remainCell}</td>
            <td data-label="備註" class="text-muted" style="font-size:0.82rem;">${r.notes || '—'}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="deleteRecord('${r.id}')">刪除</button></td>
          </tr>`;
      }).join('');
    }

    async function deleteRecord(id) {
      if (!confirm('確定刪除這筆提領記錄？')) return;
      const { error } = await supabase.from('withdrawal_records').delete().eq('id', id);
      if (error) { showToast('刪除失敗', 'danger'); return; }
      showToast('已刪除', 'warning');
      await loadRecords();
    }
  </script>
</body>
</html>
